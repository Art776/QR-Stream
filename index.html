<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анимированная передача данных по QR</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #fff; margin-top: 80px; }
        h1 { margin-bottom: 30px; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        a { 
            display: inline-block; 
            padding: 15px 30px; 
            font-size: 18px; 
            text-decoration: none; 
            background: #4CAF50; 
            color: white; 
            border-radius: 8px; 
            transition: background 0.2s;
        }
        a:hover { background: #45a049; }
        a.receiver { background: #2196F3; }
        a.receiver:hover { background: #0b7dda; }
    </style>
</head>
<body>
    <h1>Передача данных через QR-коды</h1>
    <p>Выберите режим работы приложения:</p>
    
    <div class="btn-container">
        <a href="sender.html">Отправитель (Генератор)</a>
        <a href="receiver.html" class="receiver">Получатель (Сканер)</a>
    </div>
</body>
</html>
